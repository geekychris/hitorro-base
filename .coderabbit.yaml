language: en-US

tone_instructions: >
  Be concise and pragmatic. This is a foundation Java library — flag anything that widens the module's public API or introduces new shared state.

early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "`@coderabbitai` summary"
  high_level_summary_in_walkthrough: true
  auto_title_placeholder: "`@coderabbitai` title"
  sequence_diagrams: true
  collapse_walkthrough: false
  changed_files_summary: true
  poem: false
  suggested_labels: true
  suggested_reviewers: false
  related_issues: true
  related_prs: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/*.md"
    - "!**/target/**"
  path_instructions:
    - path: "**/*"
      instructions: >
        Flag correctness, concurrency, resource-leak,
        security, and performance issues aggressively. When a change appears to
        alter an existing architectural pattern or introduce new shared/stateful
        infrastructure, call that out explicitly as an "architecture" concern
        rather than a routine style comment.
        In addition to routine correctness review, explicitly call out:
        (1) Security-relevant concerns — injection risks (e.g. building
        glob/regex/SQL/shell patterns from variable input), credential or
        secret handling, unsafe deserialization, missing input validation,
        or SSRF/timeout gaps in network/process-execution code.
        (2) Performance/concurrency concerns — thread-safety of shared
        mutable state, blocking calls inside virtual threads, unbounded
        resource usage, and missing cancellation/cleanup on
        timeout/failure paths.
        (3) Architectural concerns — new stateful/shared infrastructure,
        changes to existing module contracts, or new coupling between
        packages that weren't previously related. When such a change is
        found, describe the concern and suggest what should be verified
        or documented.
        Module-specific additions for this repository:
        This module is a foundation Java library that many downstream modules depend on. In addition to the standard checks, watch for: (1) any change that widens the public API surface (new public classes/methods/fields on foundational types) — these are hard to un-ship once callers depend on them, so verify the addition is really needed and correctly abstracted; (2) new shared mutable state (statics, singletons) and thread-safety implications; (3) equals/hashCode/compareTo changes on value types — they can silently invalidate downstream Sets/Maps.
  abort_on_close: true
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
